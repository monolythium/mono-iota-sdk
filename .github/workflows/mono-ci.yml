# Modified by Mono Labs for the Monolythium IOTA Rust SDK, 2026.
name: Monolythium SDK CI

on:
  push:
    branches:
      - mono/main
  pull_request:

permissions:
  contents: read

concurrency:
  group: mono-sdk-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate provenance and repository hygiene
        shell: bash
        run: |
          python3 <<'PYTHON'
          import fnmatch
          import hashlib
          import pathlib
          import re
          import subprocess

          manifest = pathlib.Path("UPSTREAM.yaml").read_text().splitlines()
          upstream_commit = next(
              line.split(":", 1)[1].strip()
              for line in manifest
              if line.startswith("  commit: ")
          )
          if not re.fullmatch(r"[0-9a-f]{40}", upstream_commit):
              raise SystemExit("invalid upstream commit")
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", upstream_commit, "HEAD"],
              check=True,
          )

          patterns = []
          expected_deleted = []
          in_changes = False
          in_paths = False
          in_deleted = False
          for line in manifest:
              if line == "  deleted_path_sha256:":
                  in_deleted = True
                  continue
              if in_deleted and line.startswith("    - "):
                  expected_deleted.append(line.removeprefix("    - ").strip())
                  continue
              if in_deleted and line.strip():
                  in_deleted = False
              if line == "  tracked_changes:":
                  in_changes = True
                  continue
              if in_changes and line and not line.startswith(" "):
                  break
              if not in_changes:
                  continue
              if line == "      paths:":
                  in_paths = True
                  continue
              if in_paths and line.startswith("        - "):
                  patterns.append(line.removeprefix("        - ").strip())
                  continue
              if in_paths and line.strip():
                  in_paths = False

          status_lines = subprocess.check_output(
              ["git", "diff", "--name-status", f"{upstream_commit}...HEAD"],
              text=True,
          ).splitlines()
          changed = []
          deleted = []
          for line in status_lines:
              fields = line.split("\t")
              status = fields[0]
              if status.startswith("D"):
                  deleted.append(fields[1])
              elif status.startswith(("R", "C")):
                  changed.extend(fields[1:])
              else:
                  changed.append(fields[-1])
          actual_deleted = sorted(
              hashlib.sha256(path.encode()).hexdigest() for path in deleted
          )
          if actual_deleted != sorted(expected_deleted):
              raise SystemExit("deleted-path provenance set does not match UPSTREAM.yaml")
          uncovered = [
              path
              for path in changed
              if not any(fnmatch.fnmatchcase(path, pattern) for pattern in patterns)
          ]
          if uncovered:
              raise SystemExit(
                  "overlay paths missing from UPSTREAM.yaml:\n" + "\n".join(uncovered)
              )

          added = subprocess.check_output(
              ["git", "diff", "--diff-filter=A", "--name-only", f"{upstream_commit}...HEAD"],
              text=True,
          ).splitlines()
          prose_suffixes = {".md", ".mdx", ".rst", ".adoc", ".txt"}
          allowed_new_prose = {"NOTICE"}
          unexpected_prose = [
              path
              for path in added
              if pathlib.Path(path).suffix.lower() in prose_suffixes
              and path not in allowed_new_prose
          ]
          if unexpected_prose:
              raise SystemExit(
                  "new prose files require an explicit public-document review:\n"
                  + "\n".join(unexpected_prose)
              )

          text_suffixes = {
              ".md", ".rs", ".toml", ".yaml", ".yml", ".sh", ".py", ".json"
          }
          absolute_home = re.compile(r"/(?:home|Users)/[^/\s\"']+")
          hidden_local = re.compile(r"(?:^|/)\.[a-z][a-z0-9_-]*/local(?:/|$)", re.IGNORECASE)
          for path in changed:
              candidate = pathlib.Path(path)
              if candidate.suffix not in text_suffixes or not candidate.exists():
                  continue
              text = candidate.read_text(errors="replace")
              if absolute_home.search(text) or hidden_local.search(text):
                  raise SystemExit(f"private workspace material found in {path}")
          PYTHON

      - name: Validate workflow safety
        shell: bash
        run: |
          python3 <<'PYTHON'
          import pathlib
          import re

          errors = []
          action_pattern = re.compile(r"^\s*(?:-\s*)?uses:\s*([^\s#]+)", re.MULTILINE)
          workflow_files = sorted(
              path
              for path in pathlib.Path(".github").rglob("*")
              if path.suffix in {".yml", ".yaml"}
          )
          for path in workflow_files:
              text = path.read_text()
              for reference in action_pattern.findall(text):
                  if reference.startswith("./"):
                      continue
                  if "@" not in reference or not re.fullmatch(
                      r"[0-9a-f]{40}", reference.rsplit("@", 1)[1]
                  ):
                      errors.append(f"{path}: unpinned action {reference}")
              if path.parent.name == "workflows":
                  secret_expression = "$" + "{{ " + "secrets."
                  inherited_secrets = "secrets:" + " inherit"
                  if secret_expression in text or inherited_secrets in text:
                      errors.append(f"{path}: secrets are forbidden")
                  if re.search(r"^\s*[a-z-]+:\s*write\s*$", text, re.MULTILINE):
                      errors.append(f"{path}: write permission is forbidden")
                  lines = text.splitlines()
                  root_keys = {}
                  root_syntax_is_valid = True
                  for index, line in enumerate(lines):
                      if (
                          not line.strip()
                          or line.lstrip().startswith("#")
                          or line[:1].isspace()
                      ):
                          continue
                      root = re.fullmatch(r"([a-z][a-z0-9_-]*)\s*:(.*)", line)
                      if root is None or root.group(1) in root_keys:
                          root_syntax_is_valid = False
                          break
                      root_keys[root.group(1)] = (index, root.group(2))

                  on_entry = root_keys.get("on")
                  if (
                      not root_syntax_is_valid
                      or on_entry is None
                      or not re.fullmatch(r"\s*(?:#.*)?", on_entry[1])
                  ):
                      errors.append(f"{path}: workflow trigger syntax is noncanonical")
                      continue

                  event_names = set()
                  event_indent = None
                  for line in lines[on_entry[0] + 1 :]:
                      if not line.strip() or line.lstrip().startswith("#"):
                          continue
                      indent = len(line) - len(line.lstrip())
                      if indent == 0:
                          break
                      if event_indent is None:
                          event_indent = indent
                      if indent != event_indent:
                          continue
                      event = re.fullmatch(r"([a-z0-9_-]+)\s*:.*", line.lstrip())
                      if event is None:
                          errors.append(f"{path}: workflow trigger syntax is noncanonical")
                          break
                      event_names.add(event.group(1))

                  privileged_triggers = {
                      "pull_request_" + "target",
                      "workflow_" + "run",
                  }
                  if event_names & privileged_triggers:
                      errors.append(f"{path}: privileged trigger is forbidden")
          if errors:
              raise SystemExit("\n".join(errors))
          PYTHON

      - name: Validate Apache modification notices
        shell: bash
        run: |
          upstream_commit="$({ awk '/^upstream:$/ { found=1; next } found && /^  commit:/ { print $2; exit }' UPSTREAM.yaml; })"
          while IFS= read -r modified_file; do
            if ! head -n 20 "${modified_file}" \
              | grep -Fq "Modified by Mono Labs for the Monolythium IOTA Rust SDK"; then
              echo "::error file=${modified_file}::modified upstream file lacks a change notice"
              exit 1
            fi
          done < <(git diff --diff-filter=MR --name-only "${upstream_commit}...HEAD")
          git diff --check "${upstream_commit}...HEAD"

  rust:
    name: Rust overlay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup toolchain install nightly-2026-06-29 --profile minimal --component rustfmt

      - name: Verify generated checkpoint artifacts
        shell: bash
        run: |
          RUSTUP_TOOLCHAIN=1.97.1 make grpc
          RUSTUP_TOOLCHAIN=1.97.1 make bcs-schema
          cargo +1.97.1 test --locked -p iota-sdk-bcs-schema
          git diff --exit-code -- \
            crates/iota-sdk-grpc-types/src/proto/generated/ \
            crates/iota-sdk-types/bcs-schema.abnf \
            crates/iota-sdk-move-types/bcs-schema.abnf

      - name: Test and lint canonical types
        shell: bash
        run: |
          cargo +nightly-2026-06-29 fmt -p iota-sdk-types -p iota-sdk-crypto -- --check
          cargo +1.97.1 test --locked -p iota-sdk-types --all-features
          cargo +1.97.1 clippy --locked -p iota-sdk-types -p iota-sdk-crypto --all-targets --all-features -- -D warnings

      - name: Test and lint checkpoint transport
        shell: bash
        run: |
          cargo +1.97.1 test --locked -p iota-sdk-grpc-types -p iota-sdk-grpc-client --all-features
          cargo +1.97.1 clippy --locked -p iota-sdk-grpc-types --all-targets --all-features -- -D warnings
          cargo +1.97.1 clippy --locked -p iota-sdk-grpc-client --all-targets --all-features --no-deps -- -D warnings
